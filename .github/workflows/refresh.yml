name: Refresh market data
on:
  schedule:
    - cron: "17 11 * * 1-5"   # weekdays ~7:17am New York
  workflow_dispatch:           # "Run workflow" button
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipeline/refresh.py
      - run: |
          git config user.name "re-credit-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push
